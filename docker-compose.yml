services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Kestrel!Prod2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=BarrowsWifi;User Id=sa;Password=Kestrel!Prod2026;TrustServerCertificate=True"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5080:5080"
    depends_on:
      sqlserver:
        condition: service_healthy

  admin:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./web/admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  portal:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./web/portal:/app
      - portal_node_modules:/app/node_modules
    ports:
      - "5174:5174"

volumes:
  sqldata:
  admin_node_modules:
  portal_node_modules:
